<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="msapplication-TileImage" content="icon.png">
    <title>Klasowy TikTok 🎲</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tiktokCyan: '#00f2ea',
                        tiktokPink: '#ff0050',
                        darkBg: '#08080c',
                        cardBg: 'rgba(22, 22, 30, 0.75)',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(0, 242, 234, 0.5), 0 0 30px rgba(255, 0, 80, 0.3)' },
                            '50%': { boxShadow: '0 0 25px rgba(0, 242, 234, 0.8), 0 0 45px rgba(255, 0, 80, 0.6)' },
                        },
                        spinSlow: {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' }
                        },
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' }
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 3s infinite',
                        'spin-slow': 'spinSlow 12s linear infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'marquee': 'marquee 12s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #08080c;
            color: #ffffff;
            overflow: hidden;
        }

        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(18, 18, 26, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-button {
            background: rgba(30, 30, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        /* Avatar gradient ring */
        .avatar-ring {
            padding: 2px;
            background: linear-gradient(135deg, #00f2ea 0%, #ff0050 100%);
            border-radius: 50%;
        }

        /* Neon Glow Text */
        .text-glow-cyan {
            text-shadow: 0 0 10px rgba(0, 242, 234, 0.6);
        }
        .text-glow-pink {
            text-shadow: 0 0 10px rgba(255, 0, 80, 0.6);
        }

        /* Custom scrollbar for menu */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 242, 234, 0.5);
        }

        /* Video container aspect ratio & frame */
        .video-wrapper-frame {
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 242, 234, 0.15);
        }

        /* Custom Toast notification animation */
        #toast-container {
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
    </style>
</head>
<body class="relative flex flex-col justify-between h-full w-full bg-darkBg text-white overflow-hidden">

    <!-- TOP HEADER / NAV BAR -->
    <header class="absolute top-0 left-0 right-0 z-40 px-4 py-3 flex items-center justify-between glass-panel border-b-0 rounded-b-2xl mx-2 mt-2">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-tiktokCyan to-tiktokPink flex items-center justify-center shadow-lg shadow-tiktokCyan/20">
                <svg class="w-5 h-5 text-black font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-base font-extrabold tracking-wide text-white flex items-center gap-1">
                    Klasowy <span class="text-transparent bg-clip-text bg-gradient-to-r from-tiktokCyan to-tiktokPink">TikTok</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-400 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="w-2 h-2 rounded-full bg-emerald-400 -ml-3.5"></span>
                <span>Na Żywo</span>
            </div>
            <button onclick="toggleMenu(true)" class="p-2 rounded-xl glass-button text-gray-300 hover:text-white transition active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- PROGRESS BAR (Top Loader) -->
    <div id="loader-bar-container" class="fixed top-0 left-0 right-0 z-50 h-1 bg-transparent">
        <div id="loader-bar" class="h-full w-0% bg-gradient-to-r from-tiktokCyan via-purple-500 to-tiktokPink transition-all duration-300 ease-out shadow-[0_0_12px_#00f2ea]"></div>
    </div>

    <!-- MAIN VIDEO CONTAINER -->
    <main class="relative w-full h-full flex items-center justify-center p-0 md:p-4 pt-16 pb-0">
        <div class="video-wrapper-frame relative w-full h-full max-w-md md:max-w-sm md:h-[calc(100vh-5rem)] md:rounded-3xl overflow-hidden bg-black flex items-center justify-center border border-white/10">
            
            <div id="player-wrapper" class="w-full h-full bg-black flex items-center justify-center">
                <!-- Skeleton Loader / Placeholder -->
                <div class="flex flex-col items-center justify-center space-y-3 text-gray-400">
                    <div class="w-12 h-12 rounded-full border-4 border-tiktokCyan border-t-transparent animate-spin"></div>
                    <span class="text-xs font-medium tracking-wider text-gray-400">Ładowanie nagrania...</span>
                </div>
            </div>

            <!-- OVERLAY BOTTOM INFO -->
            <div class="absolute bottom-6 left-4 right-20 z-20 pointer-events-none space-y-3">
                
                <!-- PROFILE BADGE -->
                <div onclick="toggleMenu(true)" class="pointer-events-auto inline-flex items-center space-x-3 glass-panel px-3 py-1.5 rounded-full cursor-pointer hover:bg-white/15 transition-all duration-200 active:scale-95 shadow-lg border border-white/15">
                    <div class="avatar-ring">
                        <img id="user-avatar" class="w-9 h-9 rounded-full object-cover bg-gray-800" src="https://drive.google.com/thumbnail?sz=w500&id=1qlyomGfB3xiLOuIz1o6TE1-8O19J4TsZ" alt="Avatar">
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <span id="owner" class="font-bold text-sm text-tiktokCyan tracking-wide">@wczytywanie...</span>
                        <svg class="w-4 h-4 text-tiktokCyan fill-current" viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                    </div>
                </div>

                <!-- VIDEO DESCRIPTION / FILENAME -->
                <div class="space-y-1">
                    <p id="filename" class="text-sm font-medium text-white/95 drop-shadow-md line-clamp-2 leading-snug">
                        Pobieram pliki wideo...
                    </p>
                    <div class="flex items-center space-x-2 text-xs text-gray-300/90 font-medium pt-1">
                        <svg class="w-3.5 h-3.5 text-tiktokPink animate-spin-slow" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                        </svg>
                        <div class="overflow-hidden w-48 whitespace-nowrap">
                            <span class="inline-block animate-marquee">Oryginalny dźwięk Klasowy TikTok • Klasa 2015</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- SIDE ACTION BUTTONS BAR -->
            <div class="absolute right-3 bottom-10 z-30 flex flex-col items-center space-y-4">
                
                <!-- RANDOM / NEXT BUTTON (Dice) -->
                <div class="flex flex-col items-center group">
                    <button onclick="nextVideo()" class="w-13 h-13 rounded-full glass-button bg-gradient-to-tr from-tiktokPink/80 to-rose-600/80 hover:from-tiktokPink hover:to-rose-500 text-white shadow-lg shadow-tiktokPink/30 flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-90 group-hover:rotate-180 p-3">
                        <span class="text-2xl filter drop-shadow">🎲</span>
                    </button>
                    <span class="text-[10px] font-bold text-gray-200 mt-1 shadow-black drop-shadow">Losuj</span>
                </div>

                <!-- PROFILES MENU BUTTON -->
                <div class="flex flex-col items-center">
                    <button onclick="toggleMenu(true)" class="w-12 h-12 rounded-full glass-button text-tiktokCyan hover:text-white hover:border-tiktokCyan/60 flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-90 shadow-lg p-2.5">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                    </button>
                    <span class="text-[10px] font-semibold text-gray-200 mt-1 drop-shadow">Profile</span>
                </div>

                <!-- UPLOAD BUTTON -->
                <div class="flex flex-col items-center">
                    <button onclick="document.getElementById('fileInput').click()" class="w-12 h-12 rounded-full bg-gradient-to-r from-emerald-400 to-teal-500 text-black font-extrabold flex items-center justify-center shadow-lg shadow-emerald-500/30 transition-all duration-300 hover:scale-110 active:scale-90 p-2.5">
                        <svg class="w-6 h-6 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                        </svg>
                    </button>
                    <span class="text-[10px] font-semibold text-gray-200 mt-1 drop-shadow">Dodaj</span>
                </div>

                <!-- SHARE BUTTON -->
                <div class="flex flex-col items-center">
                    <button onclick="shareVideo()" class="w-12 h-12 rounded-full glass-button text-gray-200 hover:text-tiktokCyan hover:border-tiktokCyan/50 flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-90 p-2.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                        </svg>
                    </button>
                    <span class="text-[10px] font-semibold text-gray-200 mt-1 drop-shadow">Udostępnij</span>
                </div>

            </div>
        </div>
    </main>

    <!-- HIDDEN FILE INPUT -->
    <input type="file" id="fileInput" class="hidden" accept="video/*" onchange="uploadFile(this)">

    <!-- CLASS PROFILES MODAL -->
    <div id="profiles-menu" class="fixed inset-0 z-50 hidden flex-col items-center justify-between p-6 glass-panel bg-black/90 backdrop-blur-2xl transition-all duration-300">
        
        <!-- MODAL HEADER -->
        <div class="w-full max-w-sm flex items-center justify-between pt-2 pb-4 border-b border-white/10">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">👥</span>
                <h2 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-tiktokCyan to-tiktokPink">
                    Profile Klasowe
                </h2>
            </div>
            <button onclick="toggleMenu(false)" class="p-2 rounded-full glass-button text-gray-400 hover:text-white active:scale-90">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- PROFILES GRID -->
        <div class="w-full max-w-sm my-auto py-6 overflow-y-auto custom-scrollbar">
            <p class="text-xs text-gray-400 text-center mb-6 uppercase tracking-wider font-semibold">Wybierz profil do obejrzenia</p>
            
            <div class="grid grid-cols-2 gap-4">
                <!-- Profile 1: Franek -->
                <a href="franek.html" class="group glass-panel p-4 rounded-2xl flex flex-col items-center text-center hover:border-tiktokCyan/60 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-tiktokCyan/20">
                    <div class="avatar-ring mb-3 group-hover:scale-105 transition-transform">
                        <img class="w-20 h-20 rounded-full object-cover" src="https://drive.google.com/thumbnail?sz=w400&id=1s0AT3NdWS_Ckd3g91HCEotQe4in0LUYt" alt="Franek">
                    </div>
                    <span class="font-bold text-white group-hover:text-tiktokCyan transition-colors">Franek</span>
                    <span class="text-[11px] text-gray-400 mt-0.5">Uczeń</span>
                </a>

                <!-- Profile 2: Klasa 2015 -->
                <a href="klasa.html" class="group glass-panel p-4 rounded-2xl flex flex-col items-center text-center hover:border-tiktokPink/60 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-tiktokPink/20">
                    <div class="avatar-ring mb-3 group-hover:scale-105 transition-transform" style="background: linear-gradient(135deg, #ff0050 0%, #a855f7 100%);">
                        <img class="w-20 h-20 rounded-full object-cover" src="https://drive.google.com/thumbnail?sz=w400&id=1qlyomGfB3xiLOuIz1o6TE1-8O19J4TsZ" alt="Klasa 2015">
                    </div>
                    <span class="font-bold text-white group-hover:text-tiktokPink transition-colors">Klasa 2015</span>
                    <span class="text-[11px] text-gray-400 mt-0.5">Oficjalne konto</span>
                    <!--Profile 3: madzia -->
                    <a href="madzia.html" class="group glass-panel p-4 rounded-2xl flex flex-col items-center text-center hover:border-tiktokPink/60 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-tiktokPink/20">
                    <div class="avatar-ring mb-3 group-hover:scale-105 transition-transform" style="background: linear-gradient(135deg, #ff0050 0%, #a855f7 100%);">
                        <img class="w-20 h-20 rounded-full object-cover" src="https://drive.google.com/thumbnail?sz=w400&id=1s0AT3NdWS_Ckd3g91HCEotQe4in0LUYt" alt="madzia">
                    </div>
                    <span class="font-bold text-white group-hover:text-tiktokPink transition-colors">madzia</span>
                    <span class="text-[11px] text-gray-400 mt-0.5">Uczeń</span>
                </a>
            </div>
        </div>

        <!-- CLOSE BUTTON -->
        <div class="w-full max-w-sm pb-4">
            <button onclick="toggleMenu(false)" class="w-full py-3.5 rounded-2xl font-bold bg-gradient-to-r from-tiktokPink to-rose-600 text-white shadow-lg shadow-tiktokPink/30 hover:brightness-110 active:scale-95 transition-all">
                POWRÓT DO FILMÓW
            </button>
        </div>
    </div>

    <!-- CUSTOM TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-4 transition-all duration-300">
        <div id="toast-body" class="glass-panel px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 border border-tiktokCyan/40 bg-black/80">
            <span id="toast-icon" class="text-xl">✨</span>
            <span id="toast-message" class="text-sm font-semibold text-white">Powiadomienie</span>
        </div>
    </div>

    <!-- ORIGINAL JS LOGIC - 100% PRESERVED -->
    <script>
        // TWÓJ DZIAŁAJĄCY LINK Z JSONEM:
        const url = "https://script.google.com/macros/s/AKfycbwFlyCsAm_1p9WSssyk-b-pYRGxnsAJ7SDNvhV_nHkKgglcBhcNih4hW9WAbnmlVbFNjQ/exec";

        const profilePhotos = {
            "luczakfranek2015": "1s0AT3NdWS_Ckd3g91HCEotQe4in0LUYt",
            "klasa 2015": "1qlyomGfB3xiLOuIz1o6TE1-8O19J4TsZ"
            "madzia":"1s0AT3NdWS_Ckd3g91HCEotQe4in0LUYt"
        };

        let videos = [];
        let currentVideoId = "";

        // Custom Toast Function replacing default alerts
        function showToast(msg, icon = "✨") {
            const container = document.getElementById('toast-container');
            const messageEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            messageEl.innerText = msg;
            iconEl.innerText = icon;

            container.classList.remove('opacity-0', 'translate-y-4');
            container.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                container.classList.remove('opacity-100', 'translate-y-0');
                container.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        function toggleMenu(show) { 
            const menu = document.getElementById('profiles-menu');
            if (show) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
            }
        }

        async function loadVideos() {
            try {
                const resp = await fetch(url);
                videos = await resp.json();
                if (videos.length > 0) {
                    nextVideo();
                } else {
                    document.getElementById('owner').innerText = "@pusty_folder";
                    document.getElementById('filename').innerText = "Brak dostępnych nagrań. Wrzuć pierwszy film przyciskiem +";
                    showToast("Folder z filmami jest pusty", "📂");
                }
            } catch (e) { 
                showToast("Błąd połączenia z bazą filmów!", "⚠️"); 
            }
        }

        function nextVideo() {
            if (videos.length === 0) return;
            const video = videos[Math.floor(Math.random() * videos.length)];
            currentVideoId = video.id;
            
            document.getElementById('player-wrapper').innerHTML = `<iframe class="w-full h-full border-0 rounded-none md:rounded-3xl" src="https://drive.google.com/file/d/${video.id}/preview" allow="autoplay" allowfullscreen></iframe>`;
            
            const cleanOwner = (video.owner || "").toLowerCase().trim();
            document.getElementById('owner').innerText = "@" + (video.owner || "Anonim");
            document.getElementById('filename').innerText = video.name;

            let photoID = profilePhotos[cleanOwner] || "1qlyomGfB3xiLOuIz1o6TE1-8O19J4TsZ";
            document.getElementById('user-avatar').src = `https://drive.google.com/thumbnail?sz=w500&id=${photoID}`;
        }

        async function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;
            let nick = prompt("Twój nick:");
            if (!nick) return;

            const loaderBar = document.getElementById('loader-bar');
            loaderBar.style.width = "50%";
            showToast("Wysyłanie wideo...", "⏳");

            const reader = new FileReader();
            reader.onload = async function() {
                const base64 = reader.result.split(',')[1];
                try {
                    await fetch(url, {
                        method: 'POST',
                        body: JSON.stringify({ base64: base64, mimetype: file.type, filename: nick.trim() + " - " + file.name })
                    });
                    loaderBar.style.width = "100%";
                    showToast("Pomyślnie wysłano film! Odświeżam...", "✅");
                    setTimeout(() => {
                        location.reload();
                    }, 1500);
                } catch (e) { 
                    loaderBar.style.width = "0%";
                    showToast("Błąd podczas wysyłania!", "❌"); 
                }
            };
            reader.readAsDataURL(file);
        }

        function shareVideo() {
            if (!currentVideoId) return;
            const link = "https://drive.google.com/file/d/" + currentVideoId + "/view";
            if (navigator.share) {
                navigator.share({ title: 'Klasowy TikTok', url: link }).catch(() => {});
            } else {
                const el = document.createElement('textarea');
                el.value = link;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                showToast("Skopiowano link do filmu! 🔗", "📋");
            }
        }

        window.onload = loadVideos;
    </script>
</body>
</html>
